<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-startup-image" href="icons/splash/splash-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MuhdGaming">
<title>MuhdGaming — Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="mg-nav"></div>
<div id="mg-gate" class="loading">Loading…</div>

<main id="mg-main" hidden>
  <div class="wrap" style="padding-top:40px;">
    <div class="eyebrow">Dashboard // Overview</div>
    <h1 id="greeting" style="font-size:32px; margin-top:10px;">Good evening</h1>
    <div id="substat" class="mono" style="font-size:12px; color:var(--ink-dim); margin-top:12px;"></div>
  </div>

  <div class="wrap" style="padding-top:22px;">
    <div id="hero" class="panel chamfer hero" style="position:relative; overflow:hidden;">
      <div class="bracket" style="top:14px; right:14px; border-top:2px solid #fff; border-right:2px solid #fff;"></div>
      <div class="bracket" style="bottom:14px; left:14px; border-bottom:2px solid #fff; border-left:2px solid #fff;"></div>
      <div id="hero-slides"></div>
      <div id="hero-dots" class="hero-dots"></div>
      <button id="hero-prev" class="hero-arrow left" type="button" aria-label="Previous slide">‹</button>
      <button id="hero-next" class="hero-arrow right" type="button" aria-label="Next slide">›</button>
    </div>
  </div>

  <div id="w-requests-wrap" class="wrap" style="padding-top:18px; display:none;"></div>

  <div class="wrap grid-4" style="padding:28px 40px;">
    <div class="panel chamfer" style="padding:20px;">
      <div class="eyebrow">This Week</div>
      <div id="w-thisweek" class="stack" style="margin-top:16px;"></div>
    </div>
    <div class="panel chamfer" style="padding:20px;">
      <div class="eyebrow">Needs Your RSVP</div>
      <div id="w-rsvp" class="stack" style="margin-top:16px;"></div>
    </div>
    <div class="panel chamfer" style="padding:20px;">
      <div class="eyebrow">Almost Approved</div>
      <div id="w-almost" class="stack" style="margin-top:16px;"></div>
    </div>
    <div class="panel chamfer" style="padding:20px;">
      <div class="eyebrow">Recently Active</div>
      <div id="w-active" class="stack" style="margin-top:16px;"></div>
    </div>
  </div>

  <div class="wrap row" style="padding:8px 40px 60px; justify-content:space-between; flex-wrap:wrap; gap:16px;">
    <div class="row" style="gap:12px;">
      <button id="btn-propose-game" class="btn btn-primary">+ Propose a Game</button>
      <button id="btn-propose-session" class="btn btn-ghost">+ Propose a Session</button>
    </div>
    <a href="changelog.html" class="footer-link">Changelog</a>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="assets/app.js"></script>
<script src="assets/hero.js"></script>
<script>
// Auto-advancing hero carousel — slides come from assets/hero.js. Runs
// once at page load; doesn't depend on any Firestore data.
function initHero() {
  const slides = window.MG_HERO_SLIDES || [];
  const track = document.getElementById('hero-slides');
  const dotsEl = document.getElementById('hero-dots');
  if (!track || slides.length === 0) return;

  track.innerHTML = slides.map((s, i) => `
    <div class="cover hero-slide${i === 0 ? ' active' : ''}" data-slide="${i}" style="background:${MG.coverGradient(s.title)};">
      ${MG.coverArtHtml(s.title, s.image)}
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <div class="eyebrow">MuhdGaming</div>
        <h2>${MG.escapeHtml(s.title)}</h2>
        ${s.subtitle ? `<p>${MG.escapeHtml(s.subtitle)}</p>` : ''}
        ${s.cta ? `<a href="${MG.escapeHtml(s.cta.href)}" class="btn btn-primary btn-sm">${MG.escapeHtml(s.cta.label)}</a>` : ''}
      </div>
    </div>
  `).join('');
  dotsEl.innerHTML = slides.map((_, i) => `<button class="hero-dot${i === 0 ? ' active' : ''}" data-dot="${i}" type="button" aria-label="Slide ${i + 1}"></button>`).join('');

  let current = 0;
  let timer = null;

  function show(i) {
    current = (i + slides.length) % slides.length;
    track.querySelectorAll('.hero-slide').forEach((el) => el.classList.toggle('active', +el.dataset.slide === current));
    dotsEl.querySelectorAll('.hero-dot').forEach((el) => el.classList.toggle('active', +el.dataset.dot === current));
  }
  function restart() {
    if (timer) clearInterval(timer);
    if (slides.length > 1) timer = setInterval(() => show(current + 1), 6000);
  }

  if (slides.length > 1) {
    document.getElementById('hero-prev').onclick = () => { show(current - 1); restart(); };
    document.getElementById('hero-next').onclick = () => { show(current + 1); restart(); };
    dotsEl.querySelectorAll('[data-dot]').forEach((btn) => {
      btn.onclick = () => { show(+btn.dataset.dot); restart(); };
    });
    document.getElementById('hero').addEventListener('mouseenter', () => { if (timer) clearInterval(timer); });
    document.getElementById('hero').addEventListener('mouseleave', restart);
    restart();
  } else {
    document.getElementById('hero-prev').style.display = 'none';
    document.getElementById('hero-next').style.display = 'none';
  }
}

function widgetError(elId) {
  return (err) => {
    console.error(err);
    document.getElementById(elId).innerHTML =
      `<p class="mono" style="font-size:11px; color:#ff8a6a; line-height:1.5;">${MG.escapeHtml(err.message)}</p>`;
  };
}

function renderDashboard() {
  initHero();

  const hour = new Date().getHours();
  const name = (MG.user.displayName || '').split(' ')[0];
  document.getElementById('greeting').textContent =
    (hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening') + (name ? `, ${name}` : '');

  const now = new Date();

  // THIS WEEK — soonest accepted sessions
  MG.db.collection('sessions').where('status', '==', 'accepted').onSnapshot((snap) => {
    const upcoming = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .map((s) => ({ ...s, when: MG.toDate(s.dateTime) }))
      .filter((s) => s.when && s.when >= now)
      .sort((a, b) => a.when - b.when)
      .slice(0, 2);

    const el = document.getElementById('w-thisweek');
    if (upcoming.length === 0) {
      el.innerHTML = `<p style="color:var(--ink-dim); font-size:13px;">Nothing locked in yet.</p>`;
    } else {
      el.innerHTML = upcoming.map((s) => `
        <div>
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:17px; color:var(--ink-strong);">${MG.escapeHtml(s.gameTitle)}</div>
          <div class="mono" style="font-size:11px; color:var(--ink-dim); margin-top:5px;">${MG.escapeHtml(MG.formatDateTime(s.when).toUpperCase())}</div>
          <span class="chip chip-live" style="margin-top:8px;">Accepted</span>
        </div>
      `).join('<hr style="border:none; border-top:1px solid var(--line); margin:4px 0;">');
    }
  }, widgetError('w-thisweek'));

  // NEEDS YOUR RSVP — proposed sessions you haven't answered
  MG.db.collection('sessions').where('status', '==', 'proposed').onSnapshot((snap) => {
    const mine = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .map((s) => ({ ...s, when: MG.toDate(s.dateTime) }))
      .filter((s) => !s.rsvps || !s.rsvps[MG.user.uid])
      .sort((a, b) => (a.when || 0) - (b.when || 0))
      .slice(0, 2);

    const el = document.getElementById('w-rsvp');
    if (mine.length === 0) {
      el.innerHTML = `<p style="color:var(--ink-dim); font-size:13px;">You're all caught up.</p>`;
    } else {
      el.innerHTML = mine.map((s) => `
        <div>
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:17px; color:var(--ink-strong);">${MG.escapeHtml(s.gameTitle)}</div>
          <div class="mono" style="font-size:11px; color:var(--ink-dim); margin-top:5px;">${s.when ? MG.escapeHtml(MG.formatDateTime(s.when).toUpperCase()) : ''}</div>
          <div class="row" style="margin-top:8px; gap:6px;">
            <button class="rsvp-btn" data-rsvp="yes" data-id="${s.id}">Yes</button>
            <button class="rsvp-btn" data-rsvp="maybe" data-id="${s.id}">Maybe</button>
            <button class="rsvp-btn" data-rsvp="no" data-id="${s.id}">No</button>
          </div>
        </div>
      `).join('<hr style="border:none; border-top:1px solid var(--line); margin:4px 0;">');
      el.querySelectorAll('[data-rsvp]').forEach((btn) => {
        btn.onclick = () => { btn.disabled = true; MG.setRsvp(btn.dataset.id, btn.dataset.rsvp).catch((e) => alert(e.message)); };
      });
    }
  }, widgetError('w-rsvp'));

  // ALMOST APPROVED — proposed games closest to unanimous
  MG.db.collection('games').where('status', '==', 'proposed').onSnapshot((snap) => {
    const ranked = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .map((g) => ({ ...g, voteCount: MG.voteCounts(g.votes).yes }))
      .sort((a, b) => b.voteCount - a.voteCount)
      .slice(0, 2);

    const el = document.getElementById('w-almost');
    if (ranked.length === 0) {
      el.innerHTML = `<p style="color:var(--ink-dim); font-size:13px;">No recommendations up for a vote.</p>`;
    } else {
      el.innerHTML = ranked.map((g) => {
        const segs = MG.approvalBarHtml(g.votes);
        return `
          <a href="games.html" style="text-decoration:none; display:block;">
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:17px; color:var(--ink-strong);">${MG.escapeHtml(g.title)}</div>
            <div class="mono" style="font-size:11px; color:var(--ink-dim); margin-top:5px;">${g.voteCount} OF ${MG.VOTES_TO_APPROVE} YES NEEDED</div>
            <div class="seg-bar" style="margin-top:8px;">${segs}</div>
          </a>`;
      }).join('<hr style="border:none; border-top:1px solid var(--line); margin:4px 0;">');
    }
  }, widgetError('w-almost'));

  // RECENTLY ACTIVE — approved games with the newest milestone/to-do activity
  MG.db.collection('games').where('status', '==', 'approved').onSnapshot((snap) => {
    const ranked = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .map((g) => ({ ...g, activityAt: MG.toDate(g.lastActivityAt) || MG.toDate(g.approvedAt) }))
      .filter((g) => g.activityAt)
      .sort((a, b) => b.activityAt - a.activityAt)
      .slice(0, 2);

    const el = document.getElementById('w-active');
    if (ranked.length === 0) {
      el.innerHTML = `<p style="color:var(--ink-dim); font-size:13px;">Nothing to show yet.</p>`;
    } else {
      el.innerHTML = ranked.map((g) => `
        <a href="game.html?id=${g.id}" style="text-decoration:none; display:block;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:17px; color:var(--ink-strong);">${MG.escapeHtml(g.title)}</div>
          <div class="mono" style="font-size:10.5px; color:var(--ink-dim); margin-top:6px;">${MG.escapeHtml(MG.timeAgo(g.activityAt).toUpperCase())}</div>
        </a>
      `).join('<hr style="border:none; border-top:1px solid var(--line); margin:4px 0;">');
    }
  }, widgetError('w-active'));

  document.getElementById('btn-propose-game').onclick = () => MG.openProposeGameModal();
  document.getElementById('btn-propose-session').onclick = () => MG.openProposeSessionModal();

  // PENDING REQUESTS (admins only) — a single quiet line when there's
  // nothing to do, so it doesn't compete with the rest of the dashboard;
  // swaps to a glowing, impossible-to-miss panel the moment someone's
  // actually waiting on access.
  if (MG.isAdmin) {
    const wrap = document.getElementById('w-requests-wrap');
    wrap.style.display = '';
    MG.db.collection('joinRequests').onSnapshot((snap) => {
      if (snap.empty) {
        wrap.innerHTML = `<div class="quiet-line"><span class="dot"></span>NO PENDING ACCESS REQUESTS</div>`;
        return;
      }
      wrap.innerHTML = `
        <div class="panel chamfer panel-alert" style="padding:20px;">
          <div class="row" style="justify-content:space-between; align-items:center;">
            <div class="eyebrow" style="color:var(--accent);">⚠ Pending Requests</div>
            <span class="chip chip-accent">${snap.size} WAITING</span>
          </div>
          <div id="w-requests" class="stack" style="margin-top:16px;"></div>
        </div>`;

      const el = document.getElementById('w-requests');
      el.innerHTML = snap.docs.map((d) => {
        const r = d.data();
        return `
          <div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:10px;">
            <div style="overflow-wrap:anywhere;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:var(--ink-strong);">${MG.escapeHtml(r.name)}</div>
              <div class="mono" style="font-size:10.5px; color:var(--ink-dim); margin-top:3px;">${MG.escapeHtml(r.email)}</div>
            </div>
            <div class="row" style="gap:8px;">
              <button class="btn btn-primary btn-sm" data-approve="${d.id}" data-email="${MG.escapeHtml(r.email)}" data-name="${MG.escapeHtml(r.name)}">Approve</button>
              <button class="btn btn-ghost btn-sm" data-decline="${d.id}">Decline</button>
            </div>
          </div>`;
      }).join('<hr style="border:none; border-top:1px solid var(--line); margin:4px 0;">');

      el.querySelectorAll('[data-approve]').forEach((btn) => {
        btn.onclick = () => {
          btn.disabled = true;
          MG.approveRequest(btn.dataset.approve, btn.dataset.email, btn.dataset.name).catch((e) => alert(e.message));
        };
      });
      el.querySelectorAll('[data-decline]').forEach((btn) => {
        btn.onclick = () => {
          if (!confirm('Decline this request?')) return;
          btn.disabled = true;
          MG.declineRequest(btn.dataset.decline).catch((e) => alert(e.message));
        };
      });
    }, widgetError('w-requests-wrap'));
  }
}

MG.ready('dashboard', renderDashboard);
</script>
</body>
</html>
