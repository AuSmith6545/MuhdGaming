<title>MuhdGaming — Crew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<body>

<div id="mg-nav"></div>
<div id="mg-gate" class="loading">Loading…</div>

<main id="mg-main" hidden>
  <div class="wrap" style="padding-top:40px;">
    <div class="eyebrow">Crew // The Roster</div>
    <h1 style="font-size:32px; margin-top:10px;">Who's playing</h1>
    <p style="margin-top:10px; color:var(--ink-dim); max-width:60ch;">Everyone with access to MuhdGaming.</p>
  </div>

  <div id="crew-grid" class="wrap grid-3" style="padding:28px 40px 60px;"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="assets/app.js"></script>
<script>
function formatJoinedDate(ts) {
  const d = MG.toDate(ts);
  if (!d) return null;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// friends (email-keyed, the allowlist) and users (uid-keyed, live
// name/photo) only ever link up via the email MG.ready stamps onto
// users/{uid} at sign-in — build that reverse lookup once so every friend
// can be resolved to their live profile, not just whoever's already been
// credited on a game or session somewhere.
function buildEmailToUid() {
  const map = {};
  Object.entries(MG.userProfiles).forEach(([uid, profile]) => {
    if (profile.email) map[profile.email] = uid;
  });
  return map;
}

function renderCrew() {
  const grid = document.getElementById('crew-grid');
  const emailToUid = buildEmailToUid();

  // Founding members first (earliest joinedAt), then alphabetically by
  // name for anyone without one — a hand-added-in-the-console friend, or
  // anyone who joined before this was tracked.
  const sorted = [...MG.friends].sort((a, b) => {
    const aTime = MG.toDate(a.joinedAt);
    const bTime = MG.toDate(b.joinedAt);
    if (aTime && bTime) return aTime - bTime;
    if (aTime) return -1;
    if (bTime) return 1;
    return (a.displayName || a.email).localeCompare(b.displayName || b.email);
  });

  if (sorted.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No one's on the roster yet.</div>`;
    return;
  }

  grid.innerHTML = sorted.map((f) => {
    const uid = emailToUid[f.email];
    const joined = formatJoinedDate(f.joinedAt);
    return `
    <div class="panel chamfer" style="padding:22px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;">
      ${MG.resolveAvatarHtml(uid, f.displayName, f.photoURL, 'lg')}
      <div>
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--ink-strong);">${MG.escapeHtml(MG.resolveName(uid, f.displayName))}</div>
        ${f.isAdmin ? `<span class="chip chip-accent" style="margin-top:8px;">Admin</span>` : ''}
      </div>
      <div class="mono" style="font-size:10.5px; color:var(--ink-dim); margin-top:auto;">${joined ? `MEMBER SINCE ${MG.escapeHtml(joined.toUpperCase())}` : 'MEMBER SINCE — UNKNOWN'}</div>
    </div>`;
  }).join('');
}

MG.ready('crew', renderCrew);
</script>
</body>
</html>
