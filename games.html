     handshake overlap with parsing instead of following it. Matters most on
     a phone, where each round trip is expensive and this is a multi-page
     app that pays them again on every navigation. -->

<link rel="apple-touch-startup-image" href="icons/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

<title>MuhdGaming — Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<body>

<div id="mg-nav"></div>
<div id="mg-gate" class="loading">Loading…</div>

<main id="mg-main" hidden>
  <div class="wrap page-tabbar" style="margin-top:40px;">
    <button class="page-tab active" data-status="approved" id="tab-approved">Approved</button>
    <button class="page-tab" data-status="proposed" id="tab-proposed">Recommendations</button>
    <button class="page-tab" data-status="archived" id="tab-archived">Archived</button>
  </div>

  <div class="wrap row" style="padding-top:28px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px;">
    <div>
      <div id="games-eyebrow" class="eyebrow">Games // Approved Library</div>
      <h1 id="games-title" style="font-size:32px; margin-top:10px;">The lineup</h1>
      <p id="games-sub" style="margin-top:10px; color:var(--ink-dim); max-width:60ch;">Everything approved for the shared library — each with its own milestones and to-do list.</p>
    </div>
    <button id="btn-propose-game" class="btn btn-primary" style="display:none;">+ Propose a Game</button>
    <div id="search-row" class="row" style="display:none; gap:10px; width:100%; max-width:420px;">
      <input id="games-search" class="search-input" type="text" placeholder="Search by title…" style="flex:1; min-width:0;">
      <button id="btn-open-filters" class="btn btn-ghost" type="button" style="flex-shrink:0;">Filters</button>
    </div>
  </div>

  <div id="sort-row" class="wrap row mono" style="padding-top:22px; font-size:11px; color:var(--ink-dim); letter-spacing:.05em; gap:20px; display:none;">
    <span>SORT:</span>
    <button class="toggle active" data-sort="newest" id="sort-newest">Newest</button>
    <button class="toggle" data-sort="votes" id="sort-votes">Most Votes</button>
  </div>

  <div id="games-grid" class="wrap grid-3" style="padding:22px 40px 60px;"></div>
</main>

<div id="filter-drawer-backdrop" class="side-drawer-backdrop"></div>
<div id="filter-drawer" class="side-drawer">
  <button id="btn-close-filters" class="drawer-close" type="button" aria-label="Close">&times;</button>
  <div class="eyebrow">Filter</div>
  <div id="games-facets" class="stack" style="margin-top:18px; gap:14px;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="assets/app.js"></script>
<script>
const TAB_COPY = {
  proposed: {
    eyebrow: 'Games // Recommendations',
    title: 'Up for a vote',
    sub: `Games someone in the crew wants to play — vote yes or no. Once ${MG.VOTES_TO_APPROVE} friends say yes it moves straight into the library; no one else has to vote before planning can start.`,
    empty: 'No recommendations yet — be the first to propose one.',
  },
  approved: {
    eyebrow: 'Games // Approved Library',
    title: 'The lineup',
    sub: "Everything approved for the shared library — each with its own milestones and to-do list.",
    empty: 'No games approved yet — get one through a vote first.',
  },
  archived: {
    eyebrow: 'Games // Archived',
    title: 'Shelved for now',
    sub: "Games the crew has already played and set aside — if one gets a big update or expansion, use Edit on its page and send it back up for a vote to bring it back.",
    empty: "Nothing archived yet.",
  },
};

let unsubscribeGames = null;
let currentStatus = 'approved';
let currentGames = [];        // unfiltered, from the live snapshot
let currentSort = 'newest';   // Recommendations tab only
let searchTerm = '';          // Approved/Archived tabs only
let activePlatforms = new Set();
let activeGenres = new Set();

// Milestone progress lives in a subcollection, so each card needs its own
// read to show it. Those reads used to fire on every single render — and
// renderGrid() runs on every keystroke in the search box, so typing a
// ten-letter title cost ten reads per game and flashed every card back to
// "Loading progress…" letter by letter. Cached by game id instead, and
// invalidated only when that game's lastActivityAt actually moves (every
// milestone and to-do write bumps it — see touchGame in app.js), so a real
// change still refreshes on the next snapshot.
const milestoneLabels = new Map(); // gameId -> the rendered label
const milestoneStamps = new Map(); // gameId -> lastActivityAt (ms) when counted
const milestonePending = new Set(); // reads in flight, so fast typing can't double-fetch

function milestoneLabel(gameId) {
  return milestoneLabels.get(gameId) || 'LOADING PROGRESS…';
}

function invalidateStaleMilestones(games) {
  games.forEach((g) => {
    const activity = MG.toDate(g.lastActivityAt);
    const stamp = activity ? activity.getTime() : 0;
    if (milestoneStamps.get(g.id) !== stamp) {
      milestoneLabels.delete(g.id);
      milestoneStamps.set(g.id, stamp);
    }
  });
}

function resetFilters() {
  searchTerm = '';
  activePlatforms = new Set();
  activeGenres = new Set();
  currentSort = 'newest';
  const search = document.getElementById('games-search');
  if (search) search.value = '';
  document.getElementById('sort-newest').classList.add('active');
  document.getElementById('sort-votes').classList.remove('active');
  updateFilterButtonLabel();
}

function getFilteredGames() {
  const term = searchTerm.trim().toLowerCase();
  return currentGames.filter((g) => {
    if (term && !g.title.toLowerCase().includes(term)) return false;
    if (activePlatforms.size && !(g.platforms || []).some((p) => activePlatforms.has(p))) return false;
    if (activeGenres.size && !(g.genres || []).some((gn) => activeGenres.has(gn))) return false;
    return true;
  });
}

function renderFacetRow(label, values, activeSet) {
  if (values.length === 0) return '';
  const chips = values.map((v) => `
    <button class="toggle${activeSet.has(v) ? ' active' : ''}" data-facet-value="${MG.escapeHtml(v)}" type="button">${MG.escapeHtml(v)}</button>
  `).join('');
  return `<div class="row mono" style="gap:8px; flex-wrap:wrap; align-items:center; font-size:10.5px; color:var(--ink-dim); letter-spacing:.05em;">
    <span>${label}:</span>${chips}
  </div>`;
}

function renderFacets() {
  const platforms = [...new Set(currentGames.flatMap((g) => g.platforms || []))].sort();
  const genres = [...new Set(currentGames.flatMap((g) => g.genres || []))].sort();
  const hasActiveFilters = searchTerm.trim() || activePlatforms.size || activeGenres.size;

  const facetsEl = document.getElementById('games-facets');
  facetsEl.innerHTML =
    renderFacetRow('Platform', platforms, activePlatforms) +
    renderFacetRow('Genre', genres, activeGenres) +
    (hasActiveFilters ? `<button class="btn btn-ghost btn-sm" id="btn-clear-filters" type="button" style="width:fit-content;">Clear Filters</button>` : '');

  facetsEl.querySelectorAll('[data-facet-value]').forEach((btn) => {
    btn.onclick = () => {
      const row = btn.closest('.row');
      const label = row.querySelector('span').textContent;
      const set = label === 'Platform:' ? activePlatforms : activeGenres;
      const val = btn.dataset.facetValue;
      set.has(val) ? set.delete(val) : set.add(val);
      renderFacets();
      renderGrid();
      updateFilterButtonLabel();
    };
  });
  const clearBtn = document.getElementById('btn-clear-filters');
  if (clearBtn) {
    clearBtn.onclick = () => { resetFilters(); renderFacets(); renderGrid(); updateFilterButtonLabel(); };
  }
  updateFilterButtonLabel();
}

// Filter drawer (Approved/Archived tabs) — Platform/Genre chips live
// off-screen behind one "Filters" button instead of sitting inline on the
// page, so the page itself doesn't fill up with facet chips. Search stays
// inline on the page itself (all breakpoints) since it's the primary way
// in, not a secondary refinement like the chips.
function updateFilterButtonLabel() {
  const btn = document.getElementById('btn-open-filters');
  if (!btn) return;
  const count = (searchTerm.trim() ? 1 : 0) + activePlatforms.size + activeGenres.size;
  btn.textContent = count ? `Filters (${count})` : 'Filters';
}
function openFilterDrawer() {
  document.getElementById('filter-drawer').classList.add('open');
  document.getElementById('filter-drawer-backdrop').classList.add('open');
}
function closeFilterDrawer() {
  document.getElementById('filter-drawer').classList.remove('open');
  document.getElementById('filter-drawer-backdrop').classList.remove('open');
}

// Recommendation card (Recommendations tab) — same layout/fields as the
// original Recommendations page, plus the newer lifecycle: a game where
// everyone's voted but never reached MG.VOTES_TO_APPROVE yeses swaps Yes/No
// for Remove/Move to Watchlist (the only way back into a vote from there is
// a fresh promote from the Watchlist, same restart pattern as demoting an
// approved game). Edit/Withdraw/Move to Watchlist live in the "..."
// overflow menu, same component used on the game detail page.
function renderRecCard(g) {
  const { yes, no } = MG.voteCounts(g.votes);
  // MG.friendCount is read once at sign-in, so a friend added while this
  // tab is open doesn't change the maths until a reload — a game could show
  // as a dead end for a moment when the newcomer could still vote it
  // through. Low stakes now that approval needs 2 yeses rather than the
  // whole crew (friendCount only decides when to stop asking, not when to
  // approve), which is why this stays a note rather than a re-read.
  const resolved = MG.friendCount > 0 && yes < MG.VOTES_TO_APPROVE && (yes + no) >= MG.friendCount;
  const myVote = g.votes && g.votes[MG.user.uid];
  const isYes = myVote === true;
  const isNo = myVote === false;
  const segs = MG.approvalBarHtml(g.votes);
  const canManage = (g.proposedBy && g.proposedBy.uid) === MG.user.uid || MG.isAdmin;
  const tags = (g.genres || []).slice(0, 2).map((t) => `<span class="chip">${MG.escapeHtml(t)}</span>`).join('');
  const facts = [g.price, g.releaseDate].filter(Boolean).map((t) => `<span class="chip chip-accent">${MG.escapeHtml(t)}</span>`).join('');
  const coverInner = `
    ${MG.coverArtHtml(g.title, g.image)}
    <span class="chip" style="position:relative;">${MG.escapeHtml((g.platforms || [])[0] || 'PC')}</span>
  `;
  // Same gradient/glyph placeholder either way — only whether it's a
  // clickable link to the Steam page depends on having a (safe) storeUrl.
  const safeStoreUrl = MG.safeUrl(g.storeUrl);
  const coverHtml = safeStoreUrl
    ? `<a class="cover" href="${MG.escapeHtml(safeStoreUrl)}" target="_blank" rel="noopener noreferrer" title="View ${MG.escapeHtml(g.title)} on Steam" style="background:${MG.coverGradient(g.title)}; text-decoration:none;">${coverInner}</a>`
    : `<div class="cover" style="background:${MG.coverGradient(g.title)};">${coverInner}</div>`;

  // Remove / Move to Watchlist are proposer-or-admin-only transitions
  // (same as Withdraw) — a friend who's neither just sees the outcome,
  // not buttons that would fail on click.
  const actionsHtml = resolved
    ? `
      <div class="mono" style="font-size:10.5px; color:#ff8a6a;">NOT APPROVED — FEWER THAN ${MG.VOTES_TO_APPROVE} YES</div>
      ${canManage ? `
      <div class="row" style="gap:6px; margin-top:8px;">
        <button class="btn btn-ghost btn-sm" data-withdraw="${g.id}" type="button">Remove</button>
        <button class="btn btn-ghost btn-sm" data-to-watchlist="${g.id}" type="button">Move to Watchlist</button>
      </div>` : ''}`
    : `
      <div class="row" style="gap:6px;">
        <button class="rsvp-btn${isYes ? ' active-yes' : ''}" data-vote="${g.id}" data-choice="yes">Yes</button>
        <button class="rsvp-btn${isNo ? ' active-no' : ''}" data-vote="${g.id}" data-choice="no">No</button>
      </div>`;

  const menuItemsHtml = resolved
    ? `<button type="button" data-edit="${g.id}">Edit</button>`
    : `
      <button type="button" data-edit="${g.id}">Edit</button>
      ${canManage ? `<button type="button" data-to-watchlist="${g.id}">Move to Watchlist</button>` : ''}
      ${canManage ? `<button type="button" class="danger" data-withdraw="${g.id}">Withdraw</button>` : ''}
    `;

  return `
    <div class="panel chamfer" style="display:flex; flex-direction:column;">
      ${coverHtml}
      <div style="padding:18px; display:flex; flex-direction:column; gap:14px; flex:1;">
        <div class="row" style="justify-content:space-between; align-items:flex-start; gap:8px;">
          <div>
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--ink-strong);">${MG.escapeHtml(g.title)}</div>
            <div class="row" style="gap:6px; margin-top:8px; flex-wrap:wrap;">${tags}${facts}</div>
          </div>
          <div class="menu">
            <button type="button" class="menu-btn" data-menu-btn aria-label="More actions">&#8942;</button>
            <div class="menu-panel">${menuItemsHtml}</div>
          </div>
        </div>
        <div class="mono" style="font-size:10.5px; color:var(--ink-dim);">PROPOSED BY ${MG.escapeHtml(MG.resolveName(g.proposedBy && g.proposedBy.uid, g.proposedBy && g.proposedBy.name))}</div>
        <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
          <div class="seg-bar">${segs}</div>
          <div class="mono" style="font-size:10.5px; color:var(--ink-dim);">${yes} OF ${MG.VOTES_TO_APPROVE} YES NEEDED${no ? ` · ${no} NO` : ''} (${MG.friendCount} FRIENDS)</div>
          ${actionsHtml}
        </div>
      </div>
    </div>`;
}

function wireRecCardActions(grid) {
  grid.querySelectorAll('[data-vote]').forEach((btn) => {
    btn.onclick = () => {
      btn.disabled = true;
      MG.setVote(btn.dataset.vote, btn.dataset.choice === 'yes').catch((e) => MG.alertModal(e));
    };
  });
  grid.querySelectorAll('[data-edit]').forEach((btn) => {
    btn.onclick = () => {
      const game = currentGames.find((g) => g.id === btn.dataset.edit);
      if (game) MG.openGameFormModal(game);
    };
  });
  grid.querySelectorAll('[data-to-watchlist]').forEach((btn) => {
    btn.onclick = () => {
      btn.disabled = true;
      MG.demoteToWatchlist(btn.dataset.toWatchlist).catch((e) => MG.alertModal(e));
    };
  });
  grid.querySelectorAll('[data-withdraw]').forEach((btn) => {
    btn.onclick = async () => {
      const ok = await MG.confirmModal('Withdraw this recommendation?', {
        detail: "This can't be undone. To keep the idea around instead, move it to the Watchlist.",
        confirmLabel: 'Withdraw', danger: true,
      });
      if (!ok) return;
      btn.disabled = true;
      MG.withdrawGame(btn.dataset.withdraw).catch((e) => MG.alertModal(e));
    };
  });
  MG.initMenus(grid);
}

function renderGrid() {
  const grid = document.getElementById('games-grid');
  const copy = TAB_COPY[currentStatus];
  if (currentGames.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${MG.escapeHtml(copy.empty)}</div>`;
    return;
  }

  if (currentStatus === 'proposed') {
    const sorted = [...currentGames].sort((a, b) =>
      currentSort === 'votes'
        ? MG.voteCounts(b.votes).yes - MG.voteCounts(a.votes).yes
        : (MG.toDate(b.proposedAt) || 0) - (MG.toDate(a.proposedAt) || 0)
    );
    grid.innerHTML = sorted.map(renderRecCard).join('');
    wireRecCardActions(grid);
    return;
  }

  const games = getFilteredGames();
  if (games.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No games match your filters.</div>`;
    return;
  }

  grid.innerHTML = games.map((g) => {
    const facts = [g.price, g.releaseDate].filter(Boolean).map((t) => `<span class="chip chip-accent">${MG.escapeHtml(t)}</span>`).join('');
    return `
    <a href="game.html?id=${g.id}" class="panel chamfer" style="display:flex; flex-direction:column; text-decoration:none;">
      <div class="cover" style="background:${MG.coverGradient(g.title)};">
        ${MG.coverArtHtml(g.title, g.image)}
        <span class="chip" style="position:relative;">${MG.escapeHtml((g.platforms || [])[0] || 'PC')}</span>
      </div>
      <div style="padding:18px; display:flex; flex-direction:column; gap:10px;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--ink-strong);">${MG.escapeHtml(g.title)}</div>
        ${facts ? `<div class="row" style="gap:6px; flex-wrap:wrap;">${facts}</div>` : ''}
        <div id="progress-${g.id}" class="mono" style="font-size:10.5px; color:var(--ink-dim);">${milestoneLabel(g.id)}</div>
        ${currentStatus === 'approved' ? `<div class="mono" style="font-size:10.5px; color:var(--ink-dim);">${MG.interestedTotal(g.votes, g.interested)} IN — see the game page to join</div>` : ''}
      </div>
    </a>
  `;
  }).join('');

  games.forEach((g) => {
    // Cached, or already being fetched by an earlier render — a burst of
    // keystrokes re-renders faster than a read comes back, and without the
    // pending guard each of those renders would start its own copy.
    if (milestoneLabels.has(g.id) || milestonePending.has(g.id)) return;
    milestonePending.add(g.id);
    MG.db.collection('games').doc(g.id).collection('milestones').get().then((msSnap) => {
      const total = msSnap.size;
      const done = msSnap.docs.filter((d) => d.data().status === 'done').length;
      milestoneLabels.set(g.id, total === 0 ? 'NO MILESTONES YET' : `${done} OF ${total} MILESTONES DONE`);
      const el = document.getElementById(`progress-${g.id}`);
      if (el) el.textContent = milestoneLabels.get(g.id);
    }).catch(() => {
      // Leaving the placeholder up makes a failed read look like a hang
      // that never resolves. Nothing is cached, so the next render retries.
      const el = document.getElementById(`progress-${g.id}`);
      if (el) el.textContent = 'PROGRESS UNAVAILABLE';
    }).finally(() => milestonePending.delete(g.id));
  });
}

function renderGames(status) {
  currentStatus = status;
  resetFilters();
  closeFilterDrawer(); // no longer relevant once we've left Approved/Archived
  document.getElementById('tab-proposed').classList.toggle('active', status === 'proposed');
  document.getElementById('tab-approved').classList.toggle('active', status === 'approved');
  document.getElementById('tab-archived').classList.toggle('active', status === 'archived');
  document.getElementById('sort-row').style.display = status === 'proposed' ? '' : 'none';
  document.getElementById('btn-propose-game').style.display = status === 'proposed' ? '' : 'none';
  document.getElementById('search-row').style.display = status === 'proposed' ? 'none' : '';

  const copy = TAB_COPY[status];
  document.getElementById('games-eyebrow').textContent = copy.eyebrow;
  document.getElementById('games-title').textContent = copy.title;
  document.getElementById('games-sub').textContent = copy.sub;

  if (unsubscribeGames) unsubscribeGames();
  unsubscribeGames = MG.db.collection('games').where('status', '==', status).onSnapshot((snap) => {
    if (status !== currentStatus) return; // a stale listener from a tab we've since left
    currentGames = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (MG.toDate(b.lastActivityAt) || MG.toDate(b.approvedAt) || MG.toDate(b.proposedAt) || 0) -
                      (MG.toDate(a.lastActivityAt) || MG.toDate(a.approvedAt) || MG.toDate(a.proposedAt) || 0));
    invalidateStaleMilestones(currentGames);
    if (status !== 'proposed') renderFacets();
    renderGrid();
  }, (err) => {
    console.error(err);
    document.getElementById('games-grid').innerHTML =
      `<p class="mono" style="grid-column:1/-1; color:#ff8a6a; font-size:12px;">${MG.escapeHtml(err.message)}</p>`;
  });
}

MG.ready('games', () => {
  document.getElementById('btn-propose-game').onclick = () => MG.openProposeGameModal();
  document.getElementById('tab-proposed').onclick = () => renderGames('proposed');
  document.getElementById('tab-approved').onclick = () => renderGames('approved');
  document.getElementById('tab-archived').onclick = () => renderGames('archived');
  document.getElementById('games-search').oninput = (e) => { searchTerm = e.target.value; renderGrid(); updateFilterButtonLabel(); };
  document.getElementById('btn-open-filters').onclick = () => openFilterDrawer();
  document.getElementById('btn-close-filters').onclick = () => closeFilterDrawer();
  document.getElementById('filter-drawer-backdrop').onclick = () => closeFilterDrawer();
  document.getElementById('sort-newest').onclick = () => setSort('newest');
  document.getElementById('sort-votes').onclick = () => setSort('votes');

  function setSort(s) {
    currentSort = s;
    document.getElementById('sort-newest').classList.toggle('active', s === 'newest');
    document.getElementById('sort-votes').classList.toggle('active', s === 'votes');
    renderGrid();
  }

  renderGames('approved');
});
</script>
</body>
</html>
