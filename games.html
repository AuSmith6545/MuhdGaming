<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuhdGaming — Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="mg-nav"></div>
<div id="mg-gate" class="loading">Loading…</div>

<main id="mg-main" hidden>
  <div class="wrap" style="padding-top:40px;">
    <div class="eyebrow">Games // Approved Library</div>
    <h1 style="font-size:32px; margin-top:10px;">The lineup</h1>
    <p style="margin-top:10px; color:var(--ink-dim); max-width:60ch;">Every game the whole crew has voted in — each with its own milestones and to-do list.</p>
  </div>

  <div id="games-grid" class="wrap grid-3" style="padding:22px 40px 60px;"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="assets/app.js"></script>
<script>
const COVER_GRADIENTS = [
  'linear-gradient(135deg,#1a2530,#3a2413)',
  'linear-gradient(135deg,#1c150e,#3a2508)',
  'linear-gradient(135deg,#121820,#1c2c3a)',
  'linear-gradient(135deg,#181018,#2a1a10)',
];
function coverGradient(title) {
  let hash = 0;
  for (let i = 0; i < title.length; i++) hash = (hash * 31 + title.charCodeAt(i)) | 0;
  return COVER_GRADIENTS[Math.abs(hash) % COVER_GRADIENTS.length];
}

function renderGames() {
  MG.db.collection('games').where('status', '==', 'approved').onSnapshot((snap) => {
    const games = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (MG.toDate(b.approvedAt) || 0) - (MG.toDate(a.approvedAt) || 0));

    const grid = document.getElementById('games-grid');
    if (games.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No games approved yet — get one through Recommendations first.</div>`;
      return;
    }

    grid.innerHTML = games.map((g) => `
      <a href="game.html?id=${g.id}" class="panel chamfer" style="display:flex; flex-direction:column; text-decoration:none;">
        <div class="cover" style="background:${coverGradient(g.title)};">
          ${g.image ? `<img src="${MG.escapeHtml(g.image)}" alt="">` : ''}
          <div class="glyph">${MG.escapeHtml(g.title.slice(0, 2).toUpperCase())}</div>
          <span class="chip" style="position:relative;">${MG.escapeHtml((g.platforms || [])[0] || 'PC')}</span>
        </div>
        <div style="padding:18px; display:flex; flex-direction:column; gap:10px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--ink-strong);">${MG.escapeHtml(g.title)}</div>
          <div id="progress-${g.id}" class="mono" style="font-size:10.5px; color:var(--ink-dim);">LOADING PROGRESS…</div>
        </div>
      </a>
    `).join('');

    games.forEach((g) => {
      MG.db.collection('games').doc(g.id).collection('milestones').get().then((msSnap) => {
        const el = document.getElementById(`progress-${g.id}`);
        if (!el) return;
        const total = msSnap.size;
        const done = msSnap.docs.filter((d) => d.data().status === 'done').length;
        el.textContent = total === 0 ? 'NO MILESTONES YET' : `${done} OF ${total} MILESTONES DONE`;
      }).catch(() => {});
    });
  }, (err) => {
    console.error(err);
    document.getElementById('games-grid').innerHTML =
      `<p class="mono" style="grid-column:1/-1; color:#ff8a6a; font-size:12px;">${MG.escapeHtml(err.message)}</p>`;
  });
}

MG.ready('games', renderGames);
</script>
</body>
</html>
