<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuhdGaming — Recommendations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="mg-nav"></div>
<div id="mg-gate" class="loading">Loading…</div>

<main id="mg-main" hidden>
  <div class="wrap row" style="padding-top:40px; align-items:flex-end; justify-content:space-between;">
    <div>
      <div class="eyebrow">Recommendations // Not Yet Approved</div>
      <h1 style="font-size:32px; margin-top:10px;">Up for a vote</h1>
    </div>
    <button id="btn-propose-game" class="btn btn-primary">+ Propose a Game</button>
  </div>

  <div class="wrap row mono" style="padding-top:22px; font-size:11px; color:var(--ink-dim); letter-spacing:.05em; gap:20px;">
    <span>SORT:</span>
    <button class="toggle active" data-sort="newest" id="sort-newest">Newest</button>
    <button class="toggle" data-sort="votes" id="sort-votes">Most Votes</button>
  </div>

  <div id="rec-grid" class="wrap grid-3" style="padding:22px 40px 60px;"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="assets/app.js"></script>
<script>
const COVER_GRADIENTS = [
  'linear-gradient(135deg,#1a2530,#3a2413)',
  'linear-gradient(135deg,#1c150e,#3a2508)',
  'linear-gradient(135deg,#121820,#1c2c3a)',
  'linear-gradient(135deg,#181018,#2a1a10)',
];
function coverGradient(title) {
  let hash = 0;
  for (let i = 0; i < title.length; i++) hash = (hash * 31 + title.charCodeAt(i)) | 0;
  return COVER_GRADIENTS[Math.abs(hash) % COVER_GRADIENTS.length];
}

let currentGames = [];
let currentSort = 'newest';

function renderGrid() {
  const grid = document.getElementById('rec-grid');
  if (currentGames.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No recommendations yet — be the first to propose one.</div>`;
    return;
  }
  const sorted = [...currentGames].sort((a, b) =>
    currentSort === 'votes'
      ? b.voteCount - a.voteCount
      : (MG.toDate(b.proposedAt) || 0) - (MG.toDate(a.proposedAt) || 0)
  );

  grid.innerHTML = sorted.map((g) => {
    const voted = !!(g.votes && g.votes[MG.user.uid]);
    const segs = Array.from({ length: MG.friendCount || 1 }, (_, i) =>
      `<div class="seg${i < g.voteCount ? ' on' : ''}"></div>`).join('');
    const tags = (g.genres || []).slice(0, 2).map((t) => `<span class="chip">${MG.escapeHtml(t)}</span>`).join('');
    return `
      <div class="panel chamfer" style="display:flex; flex-direction:column;">
        <div class="cover" style="background:${coverGradient(g.title)};">
          ${g.image ? `<img src="${MG.escapeHtml(g.image)}" alt="">` : ''}
          <div class="glyph">${MG.escapeHtml(g.title.slice(0, 2).toUpperCase())}</div>
          <span class="chip" style="position:relative;">${MG.escapeHtml((g.platforms || [])[0] || 'PC')}</span>
        </div>
        <div style="padding:18px; display:flex; flex-direction:column; gap:14px; flex:1;">
          <div>
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:var(--ink-strong);">${MG.escapeHtml(g.title)}</div>
            <div class="row" style="gap:6px; margin-top:8px; flex-wrap:wrap;">${tags}</div>
          </div>
          <div class="mono" style="font-size:10.5px; color:var(--ink-dim);">PROPOSED BY ${MG.escapeHtml((g.proposedBy && g.proposedBy.name) || 'a friend')}</div>
          <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
            <div class="seg-bar">${segs}</div>
            <div class="row" style="justify-content:space-between;">
              <span class="mono" style="font-size:10.5px; color:var(--ink-dim);">${g.voteCount} OF ${MG.friendCount} FRIENDS</span>
              <button class="rsvp-btn${voted ? ' active-yes' : ''}" data-vote="${g.id}">${voted ? '✓ Voted' : 'Vote'}</button>
            </div>
            <button class="btn btn-ghost btn-sm" data-withdraw="${g.id}" type="button" style="align-self:flex-start;">Withdraw</button>
          </div>
        </div>
      </div>`;
  }).join('');

  grid.querySelectorAll('[data-vote]').forEach((btn) => {
    btn.onclick = () => { btn.disabled = true; MG.toggleVote(btn.dataset.vote).catch((e) => alert(e.message)); };
  });
  grid.querySelectorAll('[data-withdraw]').forEach((btn) => {
    btn.onclick = () => {
      if (!confirm("Withdraw this recommendation? This can't be undone.")) return;
      btn.disabled = true;
      MG.withdrawGame(btn.dataset.withdraw).catch((e) => alert(e.message));
    };
  });
}

function renderRecommendations() {
  document.getElementById('btn-propose-game').onclick = () => MG.openProposeGameModal();
  document.getElementById('sort-newest').onclick = () => setSort('newest');
  document.getElementById('sort-votes').onclick = () => setSort('votes');

  function setSort(s) {
    currentSort = s;
    document.getElementById('sort-newest').classList.toggle('active', s === 'newest');
    document.getElementById('sort-votes').classList.toggle('active', s === 'votes');
    renderGrid();
  }

  MG.db.collection('games').where('status', '==', 'proposed').onSnapshot((snap) => {
    currentGames = snap.docs.map((d) => {
      const data = d.data();
      return { id: d.id, ...data, voteCount: Object.keys(data.votes || {}).length };
    });
    renderGrid();
  }, (err) => {
    console.error(err);
    document.getElementById('rec-grid').innerHTML =
      `<p class="mono" style="grid-column:1/-1; color:#ff8a6a; font-size:12px;">${MG.escapeHtml(err.message)}</p>`;
  });
}

MG.ready('recommendations', renderRecommendations);
</script>
</body>
</html>
